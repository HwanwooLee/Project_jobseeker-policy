<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신청 그 다음</title>
  <!-- 예전 버전이 이 기기에 남긴 기록 지우기 (이제 기기에는 저장하지 않음) -->
  <script src="js/cleanup.js"></script>
  <!-- 한글 픽셀 폰트 Galmuri (불러오지 못하면 맑은 고딕으로 표시) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="retro">
  <main class="container retro-container">

    <!-- 게임기 본체 -->
    <div class="console">
      <div class="screen">

        <!-- 상단 HUD -->
        <div class="hud-bar">
          <span class="hud-item">남은 시간 <strong id="hud-time">25</strong></span>
          <div class="time-bar" aria-hidden="true"><div class="time-fill" id="hud-time-fill"></div></div>
          <span class="hud-item done">처리 <strong id="hud-done">0</strong></span>
          <span class="hud-item miss">놓침 <strong id="hud-miss">0</strong></span>
          <button type="button" id="btn-sound" class="sound-btn" aria-pressed="true">소리 켜짐</button>
        </div>

        <!-- 게임 화면 + 그 위에 뜨는 패널 -->
        <div class="stage" id="game-stage">
          <canvas id="game-canvas" aria-label="러너 게임 화면. 스페이스바 또는 탭으로 점프"></canvas>

          <!-- 시작 화면 -->
          <section id="screen-intro" class="overlay">
            <div class="panel">
              <h1>신청 그 다음</h1>
              <p class="lead">신청 버튼, 누르면 끝일까요?</p>
              <p class="how">스페이스바 또는 화면 탭으로 점프! 25초 동안 할 일을 넘어보세요</p>
              <div class="px-btn-row">
                <button type="button" id="btn-start" class="px-btn">게임 시작</button>
                <a href="survey.html" class="px-btn secondary">건너뛰기</a>
              </div>
            </div>
          </section>

          <!-- 결과 화면 -->
          <section id="screen-result" class="overlay hidden">
            <div class="panel">
              <h1>게임 끝!</h1>
              <div class="score">
                <div class="score-box done">
                  <div class="label">처리한 일</div>
                  <div class="num"><span id="result-done">0</span>개</div>
                </div>
                <div class="score-box miss">
                  <div class="label">놓친 일</div>
                  <div class="num"><span id="result-miss">0</span>개</div>
                </div>
              </div>
              <p class="message">신청은 시작일 뿐이에요.<br>신청 후 할 일, 저희가 챙겨드릴게요</p>
              <div class="px-btn-row">
                <a href="survey.html" class="px-btn">내 정책 확인하기</a>
                <button type="button" id="btn-retry" class="px-btn secondary">한 번 더</button>
              </div>
              <p class="notice">게임 결과예요. 실제 지원 여부와는 관계없어요</p>
            </div>
          </section>
        </div>

      </div>
      <p class="console-label">신청 그 다음 · 25초 챌린지</p>
    </div>

    <p class="game-hint">스페이스바 또는 화면 탭 = 점프</p>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
