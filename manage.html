<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신청 후 관리 · 놓치지 마!</title>
  <!-- 예전 버전이 이 기기에 남긴 기록 지우기 (이제 기기에는 저장하지 않음) -->
  <script src="js/cleanup.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="result-wrap manage-wrap">

    <header class="survey-top">
      <a href="index.html" class="brand">놓치지 마!</a>
      <a href="result.html" class="link-muted">정책 목록으로</a>
    </header>

    <h1 class="summary-title">신청 후 관리</h1>
    <p id="manage-sub" class="summary-hidden">신청한 정책의 다음 할 일을 대신 기억해 드려요.</p>

    <!-- 상태 안내 (불러오는 중 / 오류) -->
    <p id="load-msg" class="load-msg" role="status">불러오는 중이에요…</p>

    <!-- [신청했어요]로 들어왔을 때: 신청 날짜 입력 → 관리 시작 -->
    <section id="start-card" class="start-card" hidden aria-labelledby="start-title">
      <p class="start-label">새로 관리할 정책</p>
      <h2 id="start-title" class="start-title"></h2>
      <form id="start-form" class="start-form" novalidate>
        <div class="start-field">
          <label for="start-date" class="start-date-label">신청한 날짜</label>
          <input id="start-date" type="date" class="date-input" required>
        </div>
        <div class="start-actions">
          <button type="submit" id="start-only" class="btn btn-primary start-btn">관리 시작</button>
        </div>
      </form>
      <p class="sheet-hint">관리를 시작한 뒤 아래에서 메일과 캘린더 알림을 받을 수 있어요.</p>
      <p id="start-error" class="form-error" role="alert"></p>
    </section>

    <!-- 지금 할 일 (가장 급한 1개) -->
    <section id="now-card" class="now-card" hidden aria-labelledby="now-title">
      <p class="now-label">지금 할 일</p>
      <div id="now-body"></div>
    </section>

    <!-- 정책별 관리: 목록 보기(짧은 카드) / 한 정책 보기(#p=정책번호) -->
    <a id="back-list" href="#list" class="back-list" hidden>← 관리 중인 정책 전체 보기</a>
    <h2 id="list-title" class="list-title" hidden></h2>
    <div id="app-list" class="app-list"></div>

    <!-- 정책번호도 메일 링크도 없이 들어왔을 때 -->
    <section id="empty-card" class="empty-card" hidden>
      <h2 class="empty-title">관리 기록은 메일로 받은 [관리 화면 열기] 링크로 열 수 있어요</h2>
      <p class="muted">처음이라면 정책 목록에서 정책을 고르고 [신청했어요]를 눌러 관리를 시작하세요.</p>
      <a href="result.html" class="btn btn-primary empty-btn">정책 목록 보기</a>
    </section>

    <footer class="manage-foot">
      <p class="data-note">이 기기에는 아무것도 저장되지 않아요. 내 기록은 메일 링크로만 열려요.</p>
    </footer>
  </main>
  <script src="js/manage.js"></script>
</body>
</html>
