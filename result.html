<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 맞춤 정책 · 놓치지 마!</title>
  <!-- 예전 버전이 이 기기에 남긴 기록 지우기 (이제 기기에는 저장하지 않음) -->
  <script src="js/cleanup.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="result-wrap">

    <header class="survey-top">
      <a href="index.html" class="brand">놓치지 마!</a>
      <a href="survey.html" class="link-muted">조건 다시 입력</a>
    </header>

    <!-- 요약 -->
    <section class="result-summary" aria-live="polite">
      <h1 id="summary-title" class="summary-title">정책을 불러오는 중이에요…</h1>
      <p id="summary-sub" class="summary-sub"></p>
      <p id="summary-hidden" class="summary-hidden"></p>
    </section>

    <!-- 대분류 탭 -->
    <div class="tabs" role="tablist" aria-label="정책 분야">
      <button type="button" class="tab" role="tab" data-tab="all" aria-selected="true">전체 <span class="tab-count"></span></button>
      <button type="button" class="tab" role="tab" data-tab="job" aria-selected="false">일자리 <span class="tab-count"></span></button>
      <button type="button" class="tab" role="tab" data-tab="edu" aria-selected="false">교육·훈련 <span class="tab-count"></span></button>
      <button type="button" class="tab" role="tab" data-tab="welfare" aria-selected="false">금융·복지 <span class="tab-count"></span></button>
    </div>

    <!-- 정책 카드 목록 -->
    <!-- 4개 구역: 🎯 딱 맞아요 / 🔍 맞지만 확인이 필요해요 / ⚠️ 일부 조건이 달라요 / 📋 참고용 -->
    <div id="policy-list" class="tier-list" role="tabpanel"></div>
    <p id="list-empty" class="list-empty" hidden>이 분야에는 정책이 없어요.</p>

    <p id="data-note" class="data-note"></p>
  </main>

  <!-- 정책 상세 패널 (PC: 오른쪽에서 열림 / 모바일: 아래에서 올라오는 시트) — 내용은 js/result.js가 채움 -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <div id="sheet-badges" class="pcard-top"></div>
      <h2 id="sheet-title" class="sheet-title"></h2>
      <p id="sheet-desc" class="sheet-desc"></p>
      <button type="button" id="sheet-close" class="sheet-close" aria-label="닫기">닫기</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
    <footer class="sheet-foot">
      <a id="sheet-apply" class="btn-line sheet-btn" target="_blank" rel="noopener noreferrer">신청하러 가기</a>
      <a id="sheet-done" class="btn-solid sheet-btn">신청했어요 → 관리 시작</a>
    </footer>
  </aside>

  <script src="js/result.js"></script>
</body>
</html>
